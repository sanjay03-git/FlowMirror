services:
  flowmirror:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - flowmirror-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  flowmirror-data:
